name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  # 公開してはいけない情報(鍵・個人情報らしい形)が、いまのファイルにも履歴にも無いことを確かめる。
  # 許すのは config/check_private_allow.yml に理由と出どころを書いたものだけ(CLAUDE.md「公開リポジトリとしての注意」)。
  scan_private:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (all history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Scan files for secrets and personal information
        run: bin/check-private --all

      - name: Scan every commit in the history
        run: bin/check-private --history

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    # services:
    #  redis:
    #    image: redis
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # カバレッジも測る。バックエンドが 100% を下回ると失敗する(test/simplecov_start.rb、docs/adr/0025)
      - name: Run tests (with coverage)
        env:
          RAILS_ENV: test
          COVERAGE: "1"
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

      - name: Keep the coverage report when tests fail
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: coverage
          path: ${{ github.workspace }}/coverage
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify current states against events (docs/adr/0005)
        env:
          RAILS_ENV: test
        run: bin/rails db:seed model:verify

  # ブラウザを動かすテスト(test/system、Playwright の Chromium。issue #14)。速い bin/rails test とは分けて流す
  system_test:
    # Playwright 1.58 は ubuntu 26.04(いまの ubuntu-latest)の Chromium に対応していない。版を上げるまで 24.04 に固定する
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node.js (Playwright を npx で動かす)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium (版は .playwright-version)
        run: npx -y playwright@$(cat .playwright-version) install --with-deps chromium

      - name: Build the fictional demo data (bin/demo と同じ種)
        env:
          NBATO_DEMO: "1"
          RAILS_ENV: development
        run: bin/rails demo:reset model:verify

      - name: Run system tests
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
