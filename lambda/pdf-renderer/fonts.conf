<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Lambda の Chromium が使うフォント(docs/design/pdf-lambda.md 1.2)。本番の Rails と同じ Noto の CJK だけを見る。
     serif・sans-serif の行き先を Noto にし、包みの英字のフォント(Open Sans)に落ちないようにする。 -->
<fontconfig>
  <dir>/var/task/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <config><rescan><int>0</int></rescan></config>
  <alias binding="same"><family>serif</family><prefer><family>Noto Serif CJK JP</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Noto Sans CJK JP</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Noto Sans Mono CJK JP</family></prefer></alias>
</fontconfig>
