# 手元の Docker で本番と同じ形で動かす(使うのは当面理事長 1 人)。
#   RAILS_MASTER_KEY=$(cat config/master.key) docker compose up -d --build
#   http://localhost:3200
# データ(SQLite・添付ファイル)は volume「n-bato-storage」に残る。
services:
  web:
    build: .
    image: n-bato
    ports:
      - "127.0.0.1:3200:80"
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?config/master.key の値を RAILS_MASTER_KEY に入れてください}
      RAILS_SSL: "false"
      SOLID_QUEUE_IN_PUMA: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      NBATO_URL: ${NBATO_URL:-http://localhost:3200}
      NBATO_MAIL_DELIVERY: ${NBATO_MAIL_DELIVERY:-local_mailbox}
      # パスキーを結びつけるサイト(見直し第14回: ドメインごとに分ける)。本番・ステージングはそのドメインにする
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3200}
    volumes:
      - n-bato-storage:/rails/storage
    restart: unless-stopped
volumes:
  n-bato-storage:
