# n-bato の本番(Lightsail・東京)。サーバーと周りの AWS の部品は infra/ の CDK(NBatoStack)が作る。
# 決めたことはデプロイの相談 第1〜3回(場所は CLAUDE.local.md)と開発QAボード 第6回(docs/adr/0036)。
#
# デプロイの道は 2 つ(docs/deploy.md):
#   いつも:   gh workflow run deploy.yml --ref main          # GitHub Actions の Deploy
#   予備:     NBATO_SECRETS_DIR=<秘密の置き場所> bin/kamal deploy   # Mac から
#
# 秘密(鍵・パスワード)は .kamal/secrets → bin/kamal-secret が、環境変数か NBATO_SECRETS_DIR から読む。
# リポジトリには場所も値も書かない。
service: n-bato
image: smalruby/n-bato

servers:
  web:
    - n-bato.smalruby.app

proxy:
  ssl: true
  host: n-bato.smalruby.app
  healthcheck:
    path: /up

# イメージは ghcr.io に公開で置く(ghcr.io/smalruby/n-bato。鍵は入れない。docs/adr/0036)。
# Kamal は、置くときも、サーバーで取ってくるときも docker login する。Actions は GITHUB_TOKEN
#(ジョブが終われば使えなくなる)、Mac は ghcr.env のトークン。デプロイのあとサーバーからは logout する。
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: ubuntu
  keys_only: true
  # 鍵は秘密から(Mac: n-bato-deploy、Actions: Actions だけの鍵)
  key_data:
    - NBATO_SSH_PRIVATE_KEY

env:
  secret:
    - RAILS_MASTER_KEY
    - ANTHROPIC_API_KEY
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - NBATO_MAIL_FROM
    - NBATO_BACKUP_BUCKET
    - NBATO_BACKUP_AWS_ACCESS_KEY_ID
    - NBATO_BACKUP_AWS_SECRET_ACCESS_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    NBATO_URL: https://n-bato.smalruby.app
    WEBAUTHN_RP_ID: n-bato.smalruby.app
    WEBAUTHN_ORIGIN: https://n-bato.smalruby.app
    SMTP_ADDRESS: email-smtp.ap-northeast-1.amazonaws.com
    # Slack は、人と一緒に動くか確かめるまで渡さない

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# SQLite と添付(production*.sqlite3・Active Storage)
volumes:
  - "n_bato_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
