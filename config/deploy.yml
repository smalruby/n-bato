# n-bato の本番(Lightsail・東京)。サーバーと周りの AWS の部品は infra/ の CDK(NBatoStack)が作る。
# 決めたことはデプロイの相談 第1〜3回(場所は CLAUDE.local.md)。
#
#   NBATO_SECRETS_DIR=<秘密の置き場所> bin/kamal deploy
#
# 秘密(鍵・パスワード)は NBATO_SECRETS_DIR から読む(.kamal/secrets)。リポジトリには場所も値も書かない。
<% secrets_dir = ENV.fetch("NBATO_SECRETS_DIR") { abort "NBATO_SECRETS_DIR に秘密の置き場所を入れてください" } %>
service: n-bato
image: n-bato

servers:
  web:
    - n-bato.smalruby.app

proxy:
  ssl: true
  host: n-bato.smalruby.app
  healthcheck:
    path: /up

# 手元で作ったイメージを SSH でサーバーへ直接送る(外のレジストリを使わない。Kamal 2.8 以降)
registry:
  server: localhost:5555

ssh:
  user: ubuntu
  keys_only: true
  keys:
    - <%= secrets_dir %>/n-bato-deploy

env:
  secret:
    - RAILS_MASTER_KEY
    - ANTHROPIC_API_KEY
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - NBATO_MAIL_FROM
  clear:
    SOLID_QUEUE_IN_PUMA: true
    NBATO_URL: https://n-bato.smalruby.app
    WEBAUTHN_RP_ID: n-bato.smalruby.app
    WEBAUTHN_ORIGIN: https://n-bato.smalruby.app
    SMTP_ADDRESS: email-smtp.ap-northeast-1.amazonaws.com
    # Slack は、人と一緒に動くか確かめるまで渡さない

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# SQLite と添付(production*.sqlite3・Active Storage)
volumes:
  - "n_bato_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
