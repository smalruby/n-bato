clerk:
  - [パスキー, パソコンやスマホの指紋・顔・PIN でログインする仕組み。パスワードより安全(使い回せず、なりすましのページでは働かない)]
  - [「この端末のパスキーを足す」, 名前(例「この Mac」)を入れて押すと、端末がパスキーを作る。パソコンとスマホなど複数持てる]
  - [名前, 書くとすぐ保存される]
  - [「消す」, 2 回押す。消したパスキーではログインできなくなる(元に戻せない)]
  - [10 分の決まり, ログイン(または最後に確かめた時)から 10 分を過ぎたら、足す・消す前にパスワードかパスキーでもう一度確かめる]
  - [ドメイン, パスキーは作ったサイトだけで使える。手元で作ったものは本番では使えない]
auditor:
  shown: [自分のパスキーの一覧]
  can_show: [自分のパスキーを足す・名前を変える・消す(監査の役割でもできる)]
