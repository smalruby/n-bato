clerk:
  - [申請システムを開く, 登記・供託オンライン申請システム(別のタブ)。いま使えるかと、何日の受付になるかを出す]
  - [登記がいること, 理事長・副理事長の重任・就任、住所・氏名の変更。期限は 2 週間]
  - [選んで申請を始める, 選んだものを 1 件の申請にまとめる。書類を作っている間は足す・外すができる]
  - [登記すべき事項, 申請用総合ソフトの欄に貼る文。「確かめること」が出ていたら、確かめてから申請する]
  - [添付書類, 印刷して届出印を押し、申請番号を書いて法務局に郵送する]
  - [申請したあと, 申請番号・受付番号・補正・完了を記録する(元に戻せない)。完了で、待っていたやることが作業中に戻る]
auditor:
  shown: [登記がいること, 登記の申請と記録]
  can_show: [登記すべき事項の文, 添付書類]
