states: {}
clerk:
  - [「AI と依頼を整理する」, 外から届いた依頼(メールなど)を貼ると、住所などを伏せた文を確かめてから AI に送り、やることの案が出る]
  - [「開く →」, その年度に切り替えて、解決する画面へ移る(締めた年度なら、理由の欄にやることが入る)]
  - [「状態」, 作業中・待ち(誰の何を待つか)・済みにする(ひとこと)。元に戻せる]
  - [件数の札, 期限を過ぎた・7 日以内・人がやる などの数。押すとその分だけに絞り、もう一度押すと戻す]
  - [出どころ・年度, 依頼・義務・手続きで絞る。年度をまたいだ一覧で、操作している年度では絞らない]
  - [自動で済み, 提出の記録や年度を締めた記録で確かめられるものは、n-bato が済みにする]
auditor:
  shown: [人がやることの一覧(依頼・定款や法律の義務・手続きの次の手順), 状態と期限]
  can_show: [済んだものも出す, 依頼を開くと AI との対話の記録]
