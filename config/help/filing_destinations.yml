clerk:
  - [提出先, 書類を出す先の窓口。所轄庁・法人住民税(県・市)・登記・税務署など。年度には依存しない]
  - [確認済み, 書類の宛先と手続きの説明の「所轄庁」には、確認済みの所轄庁だけを使う。直すと確認済みでなくなるので、確かめ直す]
  - [書類の宛先, "役職と氏名(市長の役職と、その氏名)。首長が替わったら書き換えて、確かめ直す"]
  - [くわしく・確かめる, 確認済みの行は「くわしく」、確かめていない行は「確かめる」。押すとその行のすぐ下に開く]
  - [連絡先, 電話番号を押すと電話をかける。入っていなければ「電話なし」「メールなし」]
  - [提出先を足す, まだ無い種類と「その他」から選ぶ]
  - [AI に調べてもらう, まだ無い種類の窓口を、法人の所在地と法人の種類だけを Claude API に送って Web で探す。見つけたものは「AI の案」として入る]
  - [様式の例, Nばとが作る提出書類を架空の法人で 1 つの PDF にする。自治体の様式と違っていたら知らせる]
auditor:
  shown: [提出先の一覧, 確かめた日と人]
  can_show: [窓口のくわしい情報]
