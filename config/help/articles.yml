states: {}
clerk:
  - [要約, 目的・事業・会員と会費・事業年度・役員・総会・理事会・決算の条をまとめて出す。条文番号を押すと全文のその条へ]
  - [主な活動, 事業ごとに、いまの活動を書く。仕訳の部門選び・AI 仕訳・事業報告書の画面に出る。年に一度、事業報告の手続きで見直す]
  - [定款の全文, 章の目次から移る。「探す」で語を含む条だけを出す]
  - [変更の記録, 版ごとに、決めた会議・所轄庁・変わった条・理由。前の版との違いは消した文と足した文で出る]
  - [定款の版, 上の欄で前の版を選べる。年度には依存しない]
  - [ほかの画面の「定款第○条」, 押すと、右ペインにその年度の時点の版の条文が出る]
auditor:
  shown: [定款の要約・全文・変更の記録, 事業ごとの主な活動]
  can_show: [前の版の定款, 前の版との違い]
