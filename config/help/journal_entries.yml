# 右ペイン「この画面の使い方」(デザインシステム HelpPanel)。states は、いまの状態に当てはまるときだけ上に出す。
states:
  provisional: 前の年度をまだ締めていないので、この年度の仕訳は「仮」です。期首の残高は、前の年度を締めたときに決まります。会計王へは書き出せません。
  closed: この年度は締めてあります。直すときは理由を書きます(変更の記録に残ります)。
  filtered: 絞り込み中です。件数は「絞り込んだ件数 / 全件」。表の上の「解除」で戻ります。
clerk:
  - [セルを直す, すぐ保存(セルが 2 秒緑になる)]
  - [Esc, 入力をやめて元の値に戻す]
  - [⌘Z / ⌘⇧Z, 元に戻す / やり直す(戻したセルへ移る)]
  - [いちばん下の行に書く, 日付・科目・金額がそろうと 1 件増える]
  - [科目の欄に「100」「消耗」, コードか名前の一部で候補を絞る。最初は使ったことのある科目だけ。いちばん下の「すべての科目を出す」で残りも出る]
  - [灰色の行, 会計王から取り込んだ仕訳。会計王で直して取り込み直す]
  - [行をクリック・Shift・⌘, 行を選ぶ(表の下に合計が出る)]
  - [年度の外の日付, 保存せずに聞く。「○○年度へ移す」で行ごと移す]
auditor:
  shown: [この年度の仕訳(日付順)。灰色は会計王から取り込んだ仕訳, 表の下に件数と、選んだ行の合計]
  can_show: [表の上で科目・部門・摘要で絞り込む(科目なら残高も出る), 上部バーで別の年度に切り替える, 「この年度の決算」で計算書類, 左メニュー「変更の記録」で、誰がいつ何を変えたか]
