states:
  closed: この年度は締めてあります。会員・役員の記録を直すときは理由を書きます。
  borrowed: この年度の記録が無い人は、近い年度の記録を出しています(名前の横に札)。
clerk:
  - [人を選んで「編集」, この年度の記録を直す。ほかの年度にも同じ値があれば、直すかを聞く]
  - [引っ越し, 新しい年度の記録だけを直す(過去の年度は直さない)]
  - [会員資格を足す, その年度の会員の種別を足す]
  - [役員の任期を足す, 就任・退任の日を入れる(年度をまたぐ)]
auditor:
  shown: [この年度の役員と、会員の名簿(会員資格), 住所などは人の画面で見る]
  can_show: [上部バーで別の年度の名簿に切り替える, 事業報告の画面で、所轄庁に出す役員名簿・社員名簿]
