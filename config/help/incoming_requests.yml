states: {}
clerk:
  - [「次へ(伏せた文を確かめる)」, 住所・電話・メールアドレス・郵便番号と、登録されている人の連絡先を伏せた文を見せる。まだ送らない]
  - [「AI に送る」, 伏せた文だけを送る。添付はチェックしたときだけ(添付は伏せられない)]
  - [「この案で決める」, AI の案どおりにやることを作る・直す。元に戻せる]
  - [「返事が来た」「終わった」と書く, AI がやることを直す案を出す]
  - [全部済んだら, 依頼を解決にし、送付状(返信)の下書きを作れる。送るのは人]
auditor:
  shown: [依頼の中身とやること, AI との対話の記録(AI に送った伏せた文)]
  can_show: [やることの一覧へ戻る]
