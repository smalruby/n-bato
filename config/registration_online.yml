# 出典: https://www.touki-kyoutaku-online.moj.go.jp/ (ご利用可能時間)・https://www.moj.go.jp/MINJI/minji60.html (受付時間)。2026-11-23 に確かめた。
shared:
  url: https://www.touki-kyoutaku-online.moj.go.jp/
