# 事業報告書等の提出(毎事業年度)。手順の画面(docs/design-system の Procedure)の定義。
# 定款の条文は、この法人の定款(第49条・第50条など)。定款が変わったらここを直す。
name: 事業報告書等の提出
period: fiscal_year       # 期間 = 事業年度(開始の年)
due: fiscal_year_end_plus_3_months
summary: 前の事業年度の事業報告書・決算書類・名簿を、総会の承認を受けて{所轄庁}に出します。
steps:
  - key: close_books
    title: 決算を締める
    guide:
      - 4月1日から3月31日までの仕訳をすべて記帳し、現金と通帳の残高が帳簿と合っていることを確かめます。
      - 会計王で年度を締め、活動計算書・貸借対照表・財産目録・計算書類の注記を作ります(N(エヌ)ばとでも同じ数字になるか確かめます)。
    law:
      - ["根拠", "定款 第49条(決算)・第50条(事業年度)"]
    checks: [現金の残高を数えた, 通帳を記帳した, 証憑の取りこぼしが無い, 会計王で年度を締めた]
    links: [fiscal_year, balance_checks, statement_activity, statement_balance_sheet]
  - key: business_report
    title: 事業報告書を書く
    guide:
      - その年度に行った事業の内容・日時・場所・参加者数・事業費を、定款の事業(①〜⑨)ごとに書きます。会議の開催と、年度末の会員数も書きます。
      - 書く前に「定款と事業」の要約で、事業ごとの主な活動がその年度の活動と合っているかを見直します。合わなければ直してから書きます(主な活動は仕訳の部門選びと AI 仕訳にも使います)。
    law:
      - ["根拠", "特定非営利活動促進法 第28条第1項"]
      - ["様式", "{所轄庁}の作成例 [16]"]
    checks: [事業ごとの主な活動を見直した, 事業ごとの実施状況を書いた, 事業費を活動計算書と合わせた, 年度末の会員数を確かめた]
    links: [articles, annual_report_edit, document_business_report]
  - key: audit
    title: 監事の監査を受ける
    guide:
      - 決算の書類と事業報告書を監事に見てもらい、監査報告書をもらいます。総会に出す前に済ませます。
    law:
      - ["根拠", "定款 第49条"]
    checks: [監事に書類を渡した]
    waits: [監査報告書を受け取った]
    links: [pack]
  - key: board
    title: 理事会で総会に出す議案を決める
    guide:
      - 理事会を開くか、理事全員の書面による同意で決めます(みなし決議)。同意が全員からそろった日に決議したことになります。
      - 議事録には、理事の総数、決議の内容、決議があったとみなされた日を書きます。
    law:
      - ["根拠", "定款 第37条第3項(書面による同意)"]
      - ["議事録", "定款 第39条"]
    waits_from: board
    links: [resolutions, new_resolution]
  - key: general_meeting
    title: 総会で承認を受ける
    guide:
      - 通常総会を開くか、正会員全員の書面による同意で、事業報告書・活動計算書・貸借対照表・財産目録を承認します。
      - 決議の画面で議案を「反映」すると、承認日が事業報告に入り、この手順は済みになります。
    law:
      - ["根拠", "定款 第29条第3項(書面による同意)"]
      - ["議事録", "定款 第31条(正会員の総数と同意した人数を書く)"]
    waits_from: regular_members
    done_when: approved
    links: [resolutions, new_resolution]
  - key: print
    title: 書類を印刷する
    guide:
      - "{所轄庁}の作成例に合わせて、提出書・事業報告書・活動計算書(注記を含む)・貸借対照表・財産目録・年間役員名簿・社員のうち10人以上の者の名簿を印刷します。押印はいりません。"
    law:
      - ["様式", "{所轄庁}の作成例 [15]〜[22]"]
      - ["押印", "不要({所轄庁}の押印廃止の一覧に含まれる)"]
    checks: [提出書の日付を入れた, 役員名簿の住所を確かめた, 社員名簿が10人以上いる]
    links: [document_letter, pack]
  - key: submit
    title: "{所轄庁}に出す"
    guide:
      - 市民部 市民生活相談課の窓口に持っていくか、郵送します。出した日を記録すると、事業報告の状態が「提出済み」になります。
      - 3年以上出さないと認証の取消しの対象になります(法第43条)。
    law:
      - ["根拠", "特定非営利活動促進法 第29条"]
      - ["期限", "毎事業年度初めの3か月以内(6月30日)"]
    checks: [控えに受付印をもらった]
    deadline: true
    final: true
    final_label: 提出した日を記録する
    effect: submitted
    links: [pack]
  - key: close_year
    title: この年度を締める
    guide:
      - 提出が済んだら、この年度を締めます。締めたときのデータ(仕訳・科目・会員・役員・法人情報)が、この年度の正になります。
      - 締めたあとにこの年度を直すときは、理由を書きます。直した内容は変更の記録に残り、提出した書類が変わるときは「再提出する」の手順が出ます。
      - 年度は古い順に締めます。締めると、次の年度の「仮」が外れ、期首の残高をこの年度の期末の残高で作り直します。
    law:
      - ["根拠", "n-bato の決まり(デザインシステム「年度」)。電子帳簿保存法の訂正・削除の履歴に当たる記録を残すため"]
    checks: [提出した書類と n-bato の数字が合っている]
    final: true
    final_label: この年度を締める
    effect: close_year
  - key: resubmit
    title: 再提出する
    only_when: resubmit_needed
    guide:
      - 締めたあとにこの年度のデータを直したので、提出した書類と n-bato の中身が食い違っています。直した内容で書類を作り直し、{所轄庁}に出し直します。
      - 直しても提出した書類の中身が変わらないときは「対象外」にします。
    law:
      - ["根拠", "特定非営利活動促進法 第29条(事業報告書等の提出)"]
    checks: [直した内容を変更の記録で確かめた, 書類を作り直した]
    final: true
    final_label: 出し直した日を記録する
    effect: resubmitted
    links: [pack]
  - key: publish_bs
    title: 貸借対照表を公告する
    guide:
      - 法人のホームページに、前の事業年度の貸借対照表を載せます。
    law:
      - ["根拠", "特定非営利活動促進法 第28条の2・定款 第56条"]
    checks: [ホームページに載せた]
    effect: bs_published
    links: [statement_balance_sheet]
  - key: corporate_tax
    title: 収益事業の申告
    optional: true
    guide:
      - 収益事業(法人税法で決まった34の事業)をした年度だけ、法人税の申告をします。していなければ「対象外」にします。
    law:
      - ["根拠", "法人税法 第4条第1項"]
    checks: [収益事業があったか確かめた]
